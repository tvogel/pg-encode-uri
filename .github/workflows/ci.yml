name: CI

on:
  push:
  pull_request:

jobs:
  pg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test with Docker
        run: |
          chmod +x test/docker-test.sh
          ./test/docker-test.sh "${{ matrix.pg }}"
